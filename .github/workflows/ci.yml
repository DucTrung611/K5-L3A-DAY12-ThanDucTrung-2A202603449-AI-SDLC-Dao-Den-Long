name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Kiểm chứng (contract + unit + scenario + determinism + bot)
        run: npm run verify
      - name: Build bản web tĩnh
        run: npm run build
      - name: Headless smoke theo đúng lệnh trong game.contract.json
        run: |
          CMD=$(node -p "require('./game.contract.json').headless_cmd")
          $CMD --seed 7 --night 1 --ticks 1200 --out out/ci-smoke.jsonl
          tail -1 out/ci-smoke.jsonl
